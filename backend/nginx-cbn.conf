# Nginx reverse proxy configuration for CBN website
# Copy to: /etc/nginx/sites-available/cbn-sl.org
# Then enable: sudo ln -s /etc/nginx/sites-available/cbn-sl.org /etc/nginx/sites-enabled/
# Then test: sudo nginx -t
# Then restart: sudo systemctl restart nginx

upstream cbn_backend {
    # Point to gunicorn/application server
    server 127.0.0.1:8000;
    
    # Uncomment for multiple backend instances (load balancing):
    # server 127.0.0.1:8000;
    # server 127.0.0.1:8001;
    # least_conn;  # Load balancing method
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name cbn-sl.org www.cbn-sl.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbn-sl.org www.cbn-sl.org;

    # ─────────────────────────────────────────────────────────
    # TLS/SSL Configuration (set by certbot)
    # ─────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/cbn-sl.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbn-sl.org/privkey.pem;

    # Modern TLS configuration (A+ rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─────────────────────────────────────────────────────────
    # Security Headers (application also sends these)
    # ─────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─────────────────────────────────────────────────────────
    # Performance: Gzip Compression
    # ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml application/x-font-ttf image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ─────────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/cbn_access.log combined;
    error_log /var/log/nginx/cbn_error.log warn;

    # ─────────────────────────────────────────────────────────
    # Root Proxy Configuration
    # ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://cbn_backend;
        
        # Headers for upstream to identify the client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts (increase if backend is slow)
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Keep-alive for performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        
        # Buffering (for large files)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ─────────────────────────────────────────────────────────
    # Static Assets (Images, CSS, JS)
    # Cache for 30 days
    # ─────────────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://cbn_backend;
        
        # Cache headers
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Pragma "public" always;
        
        # Logging (reduce noise)
        access_log /var/log/nginx/cbn_static.log combined buffer=32k flush=1m;
    }

    # ─────────────────────────────────────────────────────────
    # Health Check Endpoint (for monitoring/load balancers)
    # ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://cbn_backend;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ─────────────────────────────────────────────────────────
    # Deny Access to Sensitive Files
    # ─────────────────────────────────────────────────────────
    location ~ /backend/ {
        return 403;
    }
    location ~ /\.env {
        return 403;
    }
    location ~ /cbn\.db {
        return 403;
    }
    location ~ /\.git/ {
        return 403;
    }
    location ~ /backup/ {
        return 403;
    }

    # ─────────────────────────────────────────────────────────
    # Block XML-RPC (WordPress bot attacks)
    # ─────────────────────────────────────────────────────────
    location ~ /xmlrpc\.php {
        return 403;
    }

    # ─────────────────────────────────────────────────────────
    # Favicon & Robots (avoid 404 spam in logs)
    # ─────────────────────────────────────────────────────────
    location = /favicon.ico {
        proxy_pass http://cbn_backend;
        access_log off;
    }
    location = /robots.txt {
        proxy_pass http://cbn_backend;
        access_log off;
    }

    # ─────────────────────────────────────────────────────────
    # Custom Error Pages
    # ─────────────────────────────────────────────────────────
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;
}
