services:
  - type: web
    name: cbn-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "python -m compileall backend"
    startCommand: "cd backend && HOST=0.0.0.0 PORT=$PORT python3 server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CBN_HOST
        value: "0.0.0.0"
      - key: CBN_PORT
        value: "10000"
